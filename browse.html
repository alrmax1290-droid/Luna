<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse - Luna</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #04040a;
    --border: rgba(255,255,255,0.06);
    --accent2: #7090ff;
    --accent3: #a0b8ff;
    --moon: #e8eeff;
    --text: #d0d8f0;
    --muted: #606880;
    --dim: #303848;
}

html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
}

a {
    text-decoration: none;
    color: inherit;
}

nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    height: 58px;
    min-height: 58px;
    flex-shrink: 0;
    background: rgba(4,4,10,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
}

.nav-logo {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--moon);
    letter-spacing: 4px;
}

.nav-logo span {
    color: var(--accent2);
}

.nav-links {
    display: flex;
    gap: 2px;
}

.nav-links a {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.2s;
}

.nav-links a:hover {
    color: var(--text);
    background: rgba(255,255,255,0.06);
}

.nav-links a.active {
    color: var(--accent3);
}

/* FULL-SCREEN BROWSER */

.browser-container {
    position: relative;
    width: 100%;
    height: calc(100% - 58px);
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    background: var(--bg);
}

.browser-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    min-width: 100%;
    min-height: 100%;
    border: none;
    display: block;
    margin: 0;
    padding: 0;
    background: var(--bg);
}

@media (max-width: 700px) {
    nav {
        padding: 0 12px;
        height: auto;
        min-height: 58px;
        flex-wrap: wrap;
        gap: 8px;
    }

    .nav-links {
        flex-wrap: wrap;
    }

    .nav-links a {
        padding: 6px 9px;
        font-size: 12px;
    }

    .browser-container {
        height: auto;
    }
}
</style>
</head>

<body>

<nav>
    <a href="index.html" class="nav-logo">LU<span>NA</span></a>

    <div class="nav-links">
        <a href="index.html">home</a>
        <a href="singlefile.html">games</a>
        <a href="browse.html" class="active">browse</a>
        <a href="chat.html">chat</a>
        <a href="suggestions.html">suggestions</a>
        <a href="settings.html">settings</a>
    </div>
</nav>

<div class="browser-container">
    <iframe
        class="browser-frame"
        src="https://s3.us-east-2.amazonaws.com/youngbanana53/index.html"
        title="Luna Browser"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
```
