<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Luna</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #04040a; --bg2: #080812; --bg3: #0c0c1a;
  --surface: rgba(255,255,255,0.03);
  --surface2: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.06);
  --accent2: #7090ff; --accent3: #a0b8ff;
  --moon: #e8eeff; --text: #d0d8f0; --muted: #606880; --dim: #303848;
}
body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
a { text-decoration: none; color: inherit; }

nav { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 58px; flex-shrink: 0; background: rgba(4,4,10,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 10; }
.nav-logo { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--moon); letter-spacing: 4px; }
.nav-logo span { color: var(--accent2); }
.nav-links { display: flex; gap: 2px; }
.nav-links a { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.2s; }
.nav-links a:hover { color: var(--text); background: var(--surface2); }
.nav-links a.active { color: var(--accent3); }

/* LAYOUT */
.chat-layout { flex: 1; display: flex; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: 240px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg2); }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
.sidebar-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
.username-input { width: 100%; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: 'Space Grotesk', sans-serif; outline: none; }
.username-input:focus { border-color: rgba(112,144,255,0.4); }
.set-btn { width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px; background: var(--accent2); border: none; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.2s; }
.set-btn:hover { background: #5070ee; }

.rooms-section { padding: 12px 16px; flex: 1; overflow-y: auto; }
.rooms-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.rooms-label::before { content: '//'; color: var(--dim); }
.room-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 6px; border: none; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.15s; text-align: left; }
.room-btn:hover { background: var(--surface2); color: var(--text); }
.room-btn.active { background: rgba(112,144,255,0.1); color: var(--accent3); }
.room-icon { font-size: 14px; }

.online-section { padding: 12px 16px; border-top: 1px solid var(--border); }
.online-label { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.online-label::before { content: '//'; color: var(--dim); }
.online-user { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; color: var(--muted); cursor: pointer; transition: color 0.15s; }
.online-user:hover { color: var(--accent3); }
.online-dot { width: 6px; height: 6px; border-radius: 50%; background: #4a9a5a; flex-shrink: 0; }

/* MAIN CHAT */
.chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.chat-title { font-family: 'Space Mono', monospace; font-size: 14px; color: var(--moon); letter-spacing: 1px; }
.chat-subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }

.messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

.msg { display: flex; gap: 10px; padding: 4px 8px; border-radius: 6px; transition: background 0.1s; }
.msg:hover { background: var(--surface); }
.msg.own { flex-direction: row-reverse; }
.msg-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
.msg.own .msg-avatar { background: #4a9a5a; }
.msg-content { flex: 1; min-width: 0; }
.msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.msg.own .msg-header { flex-direction: row-reverse; }
.msg-user { font-size: 12px; font-weight: 600; color: var(--accent3); font-family: 'Space Mono', monospace; }
.msg.own .msg-user { color: #80c890; }
.msg-time { font-size: 10px; color: var(--dim); }
.msg-text { font-size: 13px; color: var(--text); line-height: 1.5; word-break: break-word; }
.msg.own .msg-text { text-align: right; }

.system-msg { text-align: center; font-size: 11px; color: var(--dim); font-family: 'Space Mono', monospace; padding: 8px; }
.dm-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: rgba(112,144,255,0.1); border: 1px solid rgba(112,144,255,0.2); font-size: 10px; color: var(--accent3); margin-bottom: 8px; font-family: 'Space Mono', monospace; }

.chat-input-wrap { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }
.chat-input { flex: 1; padding: 10px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; font-family: 'Space Grotesk', sans-serif; outline: none; transition: all 0.2s; }
.chat-input:focus { border-color: rgba(112,144,255,0.4); }
.chat-input::placeholder { color: var(--muted); }
.send-btn { padding: 10px 18px; border-radius: 10px; background: var(--accent2); border: none; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.2s; }
.send-btn:hover { background: #5070ee; }

/* DM PANEL */
.dm-panel { width: 280px; flex-shrink: 0; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg2); }
.dm-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.dm-title { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.dm-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
.dm-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.dm-input-wrap { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
.dm-input { flex: 1; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-family: 'Space Grotesk', sans-serif; outline: none; }
.dm-input:focus { border-color: rgba(112,144,255,0.3); }
.dm-send { padding: 8px 12px; border-radius: 8px; background: var(--accent2); border: none; color: #fff; font-size: 12px; cursor: pointer; }

/* No username overlay */
#usernameOverlay { position: fixed; inset: 0; z-index: 999; background: rgba(4,4,10,0.95); display: flex; align-items: center; justify-content: center; }
.username-card { background: var(--bg2); border: 1px solid rgba(112,144,255,0.2); border-radius: 16px; padding: 32px; max-width: 380px; width: 90%; text-align: center; }
.username-card h2 { font-family: 'Space Mono', monospace; font-size: 20px; color: var(--moon); margin-bottom: 8px; }
.username-card p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.username-card input { width: 100%; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-family: 'Space Grotesk', sans-serif; outline: none; margin-bottom: 12px; text-align: center; }
.username-card input:focus { border-color: rgba(112,144,255,0.4); }
.username-card button { width: 100%; padding: 12px; border-radius: 10px; background: var(--accent2); border: none; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Space Grotesk', sans-serif; }

@media (max-width: 768px) {
  .sidebar { width: 180px; }
  .dm-panel { display: none; }
}
@media (max-width: 600px) {
  nav { padding: 0 12px; }
  .nav-links a { padding: 5px 8px; font-size: 11px; }
  .sidebar { display: none; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">LU<span>NA</span></a>
  <div class="nav-links">
    <a href="index.html">home</a>
    <a href="singlefile.html">games</a>
    <a href="browse.html">browse</a>
    <a href="chat.html" class="active">chat</a>
    <a href="suggestions.html">suggestions</a>
    <a href="settings.html">settings</a>
  </div>
</nav>

<!-- USERNAME OVERLAY -->
<div id="usernameOverlay">
  <div class="username-card">
    <div style="font-size:40px;margin-bottom:16px;">💬</div>
    <h2>pick a name</h2>
    <p>this is how others will see you in chat</p>
    <input type="text" id="usernameSetInput" placeholder="enter username..." maxlength="20" onkeydown="if(event.key==='Enter')setUsername()">
    <button onclick="setUsername()">enter chat →</button>
  </div>
</div>

<div class="chat-layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-label">you are</div>
      <div id="currentUser" style="font-size:13px;font-weight:600;color:var(--accent3);font-family:'Space Mono',monospace;margin-bottom:8px;">...</div>
      <input type="text" class="username-input" id="changeUsername" placeholder="change username...">
      <button class="set-btn" onclick="changeUsernameHandler()">change</button>
    </div>
    <div class="rooms-section">
      <div class="rooms-label">rooms</div>
      <button class="room-btn active" id="room-general" onclick="switchRoom('general')">
        <span class="room-icon">💬</span> general
      </button>
      <button class="room-btn" id="room-games" onclick="switchRoom('games')">
        <span class="room-icon">🎮</span> games
      </button>
      <button class="room-btn" id="room-random" onclick="switchRoom('random')">
        <span class="room-icon">🎲</span> random
      </button>
      <button class="room-btn" id="room-homework" onclick="switchRoom('homework')">
        <span class="room-icon">📚</span> homework
      </button>
    </div>
    <div class="online-section">
      <div class="online-label">online</div>
      <div id="onlineList"></div>
    </div>
  </div>

  <!-- MAIN CHAT -->
  <div class="chat-main">
    <div class="chat-header">
      <div>
        <div class="chat-title" id="chatRoomTitle"># general</div>
        <div class="chat-subtitle" id="chatRoomSub">everyone on luna</div>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="system-msg">welcome to luna chat 🌙</div>
    </div>
    <div class="chat-input-wrap">
      <input type="text" class="chat-input" id="chatInput" placeholder="say something... paste image URL or /gif cats" maxlength="300" onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" onclick="sendMessage()">send</button>
    </div>
  </div>

  <!-- DM PANEL -->
  <div class="dm-panel" id="dmPanel" style="display:none;">
    <div class="dm-header">
      <div>
        <div class="dm-title">direct message</div>
        <div id="dmTarget" style="font-size:12px;color:var(--accent3);margin-top:2px;"></div>
      </div>
      <button class="dm-close" onclick="closeDM()">×</button>
    </div>
    <div class="dm-messages" id="dmMessages"></div>
    <div class="dm-input-wrap">
      <input type="text" class="dm-input" id="dmInput" placeholder="message..." maxlength="300" onkeydown="if(event.key==='Enter')sendDM()">
      <button class="dm-send" onclick="sendDM()">→</button>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://cosmoshub.alrmax1290.workers.dev';
let username = localStorage.getItem('luna_username') || '';
let currentRoom = 'general';
let lastMessageTime = 0;
let dmUser = null;
let lastDMTime = 0;
let pollInterval = null;
let dmInterval = null;
let onlineInterval = null;

const roomInfo = {
  general: { title: '# general', sub: 'everyone on luna' },
  games: { title: '# games', sub: 'talk about games' },
  random: { title: '# random', sub: 'anything goes' },
  homework: { title: '# homework', sub: 'help each other out' },
};

// Init
if (username) {
  document.getElementById('usernameOverlay').style.display = 'none';
  document.getElementById('currentUser').textContent = username;
  startChat();
}

function setUsername() {
  const val = document.getElementById('usernameSetInput').value.trim();
  if (!val || val.length < 2) { alert('pick a name with at least 2 characters'); return; }
  username = val;
  localStorage.setItem('luna_username', username);
  document.getElementById('usernameOverlay').style.display = 'none';
  document.getElementById('currentUser').textContent = username;
  startChat();
}

function changeUsernameHandler() {
  const val = document.getElementById('changeUsername').value.trim();
  if (!val || val.length < 2) return;
  username = val;
  localStorage.setItem('luna_username', username);
  document.getElementById('currentUser').textContent = username;
  document.getElementById('changeUsername').value = '';
}

function startChat() {
  loadMessages();
  pollInterval = setInterval(pollMessages, 3000);
  onlineInterval = setInterval(pingOnline, 8000);
  pingOnline();
}

function switchRoom(room) {
  currentRoom = room;
  lastMessageTime = 0;
  document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('room-' + room).classList.add('active');
  document.getElementById('chatRoomTitle').textContent = roomInfo[room].title;
  document.getElementById('chatRoomSub').textContent = roomInfo[room].sub;
  document.getElementById('messages').innerHTML = '<div class="system-msg">switched to #' + room + '</div>';
  loadMessages();
}

async function loadMessages() {
  try {
    const res = await fetch(`${WORKER}/chat?room=${currentRoom}&since=${lastMessageTime}`);
    const data = await res.json();
    if (data.messages && data.messages.length) {
      appendMessages(data.messages);
      lastMessageTime = data.messages[data.messages.length - 1].time;
    }
  } catch(e) {}
}

async function pollMessages() {
  try {
    const res = await fetch(`${WORKER}/chat?room=${currentRoom}&since=${lastMessageTime}`);
    const data = await res.json();
    if (data.messages && data.messages.length) {
      appendMessages(data.messages);
      lastMessageTime = data.messages[data.messages.length - 1].time;
    }
  } catch(e) {}
}

function renderMessageContent(text) {
  const imgRegex = /https?:\/\/\S+\.(png|jpg|jpeg|gif|webp)(\?\S*)?/gi;

  // /gif command — fetch from Giphy API
  if (text.startsWith('/gif ')) {
    const query = encodeURIComponent(text.slice(5).trim());
    const id = 'gif_' + Math.random().toString(36).slice(2);
    setTimeout(async () => {
      try {
        const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=${query}&limit=1&rating=g`);
        const data = await res.json();
        const el = document.getElementById(id);
        if (el && data.data && data.data[0]) {
          const url = data.data[0].images.fixed_height.url;
          el.innerHTML = `<img src="${url}" style="max-width:240px;border-radius:8px;display:block;margin-top:6px;" onclick="window.open('${url}','_blank')">`;
        } else if (el) {
          el.textContent = 'no gif found';
        }
      } catch(e) {}
    }, 0);
    return `<span style="font-size:11px;color:var(--muted);">/gif ${text.slice(5)}</span><div id="${id}" style="margin-top:4px;"><span style="font-size:11px;color:var(--dim);">loading gif...</span></div>`;
  }

  // Image URL — embed directly
  if (imgRegex.test(text)) {
    imgRegex.lastIndex = 0;
    const safe = text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return safe.replace(/https?:\/\/\S+\.(png|jpg|jpeg|gif|webp)(\?\S*)?/gi, (url) => {
      return `<a href="${url}" target="_blank" style="color:var(--accent3);">${url}</a><br><img src="${url}" style="max-width:240px;max-height:200px;border-radius:8px;display:block;margin-top:6px;cursor:pointer;" onclick="window.open('${url}','_blank')" onerror="this.style.display='none'">`;
    });
  }

  // Regular URLs — linkify
  const safe = text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return safe.replace(/https?:\/\/[^\s]+/g, (url) => {
    return `<a href="${url}" target="_blank" style="color:var(--accent3);text-decoration:underline;">${url}</a>`;
  });
}

function appendMessages(msgs) {
  const container = document.getElementById('messages');
  const wasAtBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;
  msgs.forEach(msg => {
    const div = document.createElement('div');
    div.className = 'msg' + (msg.user === username ? ' own' : '');
    const initial = (msg.user || '?')[0].toUpperCase();
    const time = new Date(msg.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const isOwn = msg.user === username;
    div.innerHTML = `
      <div class="msg-avatar">${initial}</div>
      <div class="msg-content">
        <div class="msg-header">
          <span class="msg-user" onclick="openDM('${msg.user}')" style="cursor:pointer;">${msg.user}</span>
          <span class="msg-time">${time}</span>
          ${isOwn ? `<button onclick="deleteMsg('${msg.id}')" style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px;padding:0 4px;opacity:0;transition:opacity 0.2s;" class="del-btn">✕</button>` : ''}
        </div>
        <div class="msg-text">${renderMessageContent(msg.text)}</div>
      </div>
    `;
    div.addEventListener('mouseenter', () => { const b = div.querySelector('.del-btn'); if(b) b.style.opacity='1'; });
    div.addEventListener('mouseleave', () => { const b = div.querySelector('.del-btn'); if(b) b.style.opacity='0'; });
    container.appendChild(div);
  });
  if (wasAtBottom) container.scrollTop = container.scrollHeight;
}

async function deleteMsg(id) {
  try {
    await fetch(`${WORKER}/chat/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: currentRoom, id, user: username })
    });
    // Remove from DOM immediately
    document.querySelectorAll('.msg').forEach(el => {
      if (el.querySelector('.del-btn') && el.querySelector('.del-btn').getAttribute('onclick').includes(id)) {
        el.remove();
      }
    });
  } catch(e) {}
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !username) return;
  input.value = '';
  try {
    await fetch(`${WORKER}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: currentRoom, user: username, text })
    });
    await pollMessages();
  } catch(e) {}
}

// DM
function openDM(user) {
  if (user === username) return;
  dmUser = user;
  document.getElementById('dmPanel').style.display = 'flex';
  document.getElementById('dmTarget').textContent = user;
  document.getElementById('dmMessages').innerHTML = '';
  lastDMTime = 0;
  loadDMs();
  if (dmInterval) clearInterval(dmInterval);
  dmInterval = setInterval(loadDMs, 4000);
}

function closeDM() {
  dmUser = null;
  document.getElementById('dmPanel').style.display = 'none';
  if (dmInterval) clearInterval(dmInterval);
}

async function loadDMs() {
  if (!dmUser) return;
  try {
    const res = await fetch(`${WORKER}/dm?user=${username}&other=${dmUser}`);
    const data = await res.json();
    if (data.messages && data.messages.length) {
      const container = document.getElementById('dmMessages');
      const newMsgs = lastDMTime ? data.messages.filter(m => m.time > lastDMTime) : data.messages;
      newMsgs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'msg' + (msg.from === username ? ' own' : '');
        const time = new Date(msg.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        div.innerHTML = `
          <div class="msg-avatar">${msg.from[0].toUpperCase()}</div>
          <div class="msg-content">
            <div class="msg-header"><span class="msg-user">${msg.from}</span><span class="msg-time">${time}</span></div>
            <div class="msg-text">${renderMessageContent(msg.text)}</div>
          </div>
        `;
        container.appendChild(div);
      });
      if (newMsgs.length) {
        lastDMTime = data.messages[data.messages.length - 1].time;
        container.scrollTop = container.scrollHeight;
      }
    }
  } catch(e) {}
}

async function sendDM() {
  const input = document.getElementById('dmInput');
  const text = input.value.trim();
  if (!text || !dmUser || !username) return;
  input.value = '';
  try {
    await fetch(`${WORKER}/dm`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from: username, to: dmUser, text })
    });
    await loadDMs();
  } catch(e) {}
}

// Online users
async function pingOnline() {
  if (!username) return;
  try {
    const res = await fetch(`${WORKER}/online`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: username })
    });
    const data = await res.json();
    const list = document.getElementById('onlineList');
    list.innerHTML = data.online.map(u => `
      <div class="online-user" onclick="openDM('${u}')">
        <div class="online-dot"></div>
        <span>${u}${u === username ? ' (you)' : ''}</span>
      </div>
    `).join('');
  } catch(e) {}
}

// F1 panic
document.addEventListener('keydown', e => {
  if (e.key === 'F1') { e.preventDefault(); window.location.href = 'https://google.com'; }
});

// Page transitions
document.querySelectorAll('a[href]').forEach(link => {
  const href = link.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('http')) return;
  link.addEventListener('click', e => {
    e.preventDefault();
    if (pollInterval) clearInterval(pollInterval);
    if (dmInterval) clearInterval(dmInterval);
    if (onlineInterval) clearInterval(onlineInterval);
    setTimeout(() => { window.location.href = href; }, 200);
  });
});
</script>
</body>
</html>
