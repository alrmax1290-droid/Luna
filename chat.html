<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Luna</title>
<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #04040a;
  --bg2: #080812;
  --bg3: #0c0c1a;
  --surface: rgba(255,255,255,0.03);
  --surface2: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.06);
  --accent2: #7090ff;
  --accent3: #a0b8ff;
  --moon: #e8eeff;
  --text: #d0d8f0;
  --muted: #606880;
  --dim: #303848;
  --danger: #ff5c6c;
  --success: #4a9a5a;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}

/* NAV */

nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 58px;
  flex-shrink: 0;
  background: rgba(4,4,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.nav-logo {
  font-family: 'Space Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--moon);
  letter-spacing: 4px;
}

.nav-logo span {
  color: var(--accent2);
}

.nav-links {
  display: flex;
  gap: 2px;
}

.nav-links a {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: all 0.2s;
}

.nav-links a:hover {
  color: var(--text);
  background: var(--surface2);
}

.nav-links a.active {
  color: var(--accent3);
}

/* LAYOUT */

.chat-layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* SIDEBAR */

.sidebar {
  width: 240px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg2);
}

.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.username-input {
  width: 100%;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Space Grotesk', sans-serif;
  outline: none;
}

.username-input:focus {
  border-color: rgba(112,144,255,0.4);
}

.set-btn {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  border-radius: 8px;
  background: var(--accent2);
  border: none;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
}

.set-btn:hover {
  background: #5070ee;
}

/* ADMIN */

.admin-box {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.admin-box.show {
  display: block;
}

.admin-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--danger);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.admin-status {
  font-size: 11px;
  color: var(--success);
  margin-bottom: 8px;
}

.admin-logout {
  width: 100%;
  padding: 7px;
  border-radius: 7px;
  border: 1px solid rgba(255,92,108,0.25);
  background: rgba(255,92,108,0.08);
  color: var(--danger);
  cursor: pointer;
}

/* ROOMS */

.rooms-section {
  padding: 12px 16px;
  flex: 1;
  overflow-y: auto;
}

.rooms-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.rooms-label::before {
  content: '//';
  color: var(--dim);
}

.room-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  transition: all 0.15s;
  text-align: left;
}

.room-btn:hover {
  background: var(--surface2);
  color: var(--text);
}

.room-btn.active {
  background: rgba(112,144,255,0.1);
  color: var(--accent3);
}

.room-icon {
  font-size: 14px;
}

/* ONLINE */

.online-section {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.online-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.online-user {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
}

.online-user:hover {
  color: var(--accent3);
}

.online-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
}

/* MAIN CHAT */

.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.chat-title {
  font-family: 'Space Mono', monospace;
  font-size: 14px;
  color: var(--moon);
  letter-spacing: 1px;
}

.chat-subtitle {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.messages::-webkit-scrollbar {
  width: 4px;
}

.messages::-webkit-scrollbar-thumb {
  background: var(--dim);
  border-radius: 2px;
}

/* MESSAGE */

.msg {
  display: flex;
  gap: 10px;
  padding: 4px 8px;
  border-radius: 6px;
  transition: background 0.1s;
}

.msg:hover {
  background: var(--surface);
}

.msg.own {
  flex-direction: row-reverse;
}

.msg-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.msg.own .msg-avatar {
  background: var(--success);
}

.msg-content {
  flex: 1;
  min-width: 0;
}

.msg-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}

.msg.own .msg-header {
  flex-direction: row-reverse;
}

.msg-user {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent3);
  font-family: 'Space Mono', monospace;
}

.msg.own .msg-user {
  color: #80c890;
}

.msg-time {
  font-size: 10px;
  color: var(--dim);
}

.msg-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
  word-break: break-word;
}

.msg.own .msg-text {
  text-align: right;
}

/* DELETE BUTTON */

.del-btn {
  background: rgba(255,92,108,0.08);
  border: 1px solid rgba(255,92,108,0.15);
  color: var(--danger);
  cursor: pointer;
  font-size: 10px;
  padding: 3px 6px;
  border-radius: 5px;
  margin-left: 4px;
}

.del-btn:hover {
  background: rgba(255,92,108,0.2);
}

/* SYSTEM */

.system-msg {
  text-align: center;
  font-size: 11px;
  color: var(--dim);
  font-family: 'Space Mono', monospace;
  padding: 8px;
}

/* INPUT */

.chat-input-wrap {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.chat-input {
  flex: 1;
  padding: 10px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Space Grotesk', sans-serif;
  outline: none;
}

.chat-input:focus {
  border-color: rgba(112,144,255,0.4);
}

.chat-input::placeholder {
  color: var(--muted);
}

.send-btn {
  padding: 10px 18px;
  border-radius: 10px;
  background: var(--accent2);
  border: none;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* DM */

.dm-panel {
  width: 280px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg2);
}

.dm-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dm-title {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.dm-close {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
}

.dm-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
}

.dm-input-wrap {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}

.dm-input {
  flex: 1;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 12px;
  outline: none;
}

.dm-send {
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--accent2);
  border: none;
  color: #fff;
  cursor: pointer;
}

/* USERNAME */

#usernameOverlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(4,4,10,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
}

.username-card {
  background: var(--bg2);
  border: 1px solid rgba(112,144,255,0.2);
  border-radius: 16px;
  padding: 32px;
  max-width: 380px;
  width: 90%;
  text-align: center;
}

.username-card h2 {
  font-family: 'Space Mono', monospace;
  font-size: 20px;
  color: var(--moon);
  margin-bottom: 8px;
}

.username-card p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 24px;
}

.username-card input {
  width: 100%;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  margin-bottom: 12px;
  text-align: center;
}

.username-card button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  background: var(--accent2);
  border: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

/* FILTER WARNING */

.filter-warning {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%);
  background: #241018;
  border: 1px solid rgba(255,92,108,0.35);
  color: #ff9da7;
  padding: 10px 16px;
  border-radius: 9px;
  font-size: 12px;
  z-index: 1000;
  display: none;
}

/* MOBILE */

@media (max-width: 768px) {
  .sidebar {
    width: 180px;
  }

  .dm-panel {
    display: none !important;
  }
}

@media (max-width: 600px) {
  nav {
    padding: 0 12px;
  }

  .nav-links a {
    padding: 5px 8px;
    font-size: 11px;
  }

  .sidebar {
    display: none;
  }
}
</style>
</head>

<body>

<nav>
  <a href="index.html" class="nav-logo">LU<span>NA</span></a>

  <div class="nav-links">
    <a href="index.html">home</a>
    <a href="singlefile.html">games</a>
    <a href="browse.html">browse</a>
    <a href="chat.html" class="active">chat</a>
    <a href="suggestions.html">suggestions</a>
    <a href="settings.html">settings</a>
  </div>
</nav>

<!-- USERNAME OVERLAY -->

<div id="usernameOverlay">

  <div class="username-card">

    <div style="font-size:40px;margin-bottom:16px;">💬</div>

    <h2>pick a name</h2>

    <p>
      this is how others will see you in chat
    </p>

    <input
      type="text"
      id="usernameSetInput"
      placeholder="enter username..."
      maxlength="20"
      onkeydown="if(event.key==='Enter')setUsername()"
    >

    <button onclick="setUsername()">
      enter chat →
    </button>

  </div>

</div>

<!-- FILTER WARNING -->

<div id="filterWarning" class="filter-warning">

</div>

<div class="chat-layout">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="sidebar-header">

      <div class="sidebar-label">
        you are
      </div>

      <div
        id="currentUser"
        style="font-size:13px;font-weight:600;color:var(--accent3);font-family:'Space Mono',monospace;margin-bottom:8px;"
      >
        ...
      </div>

      <input
        type="text"
        class="username-input"
        id="changeUsername"
        placeholder="change username..."
      >

      <button
        class="set-btn"
        onclick="changeUsernameHandler()"
      >
        change
      </button>

      <!-- ADMIN PANEL -->

      <div id="adminBox" class="admin-box">

        <div class="admin-label">
          admin controls

        <div class="admin-status">

        </div>

        <button

          onclick="logoutAdmin()"

    </div>

    <!-- ROOMS -->

    <div class="rooms-section">

      <div class="rooms-label">
        rooms
      </div>

      <button

        id="room-general"

      >
        <span class="room-icon">💬</span>
        general
      </button>

      <button
        class="room-btn"
        id="room-games"
        onclick="switchRoom('games')"
      >
        <span class="room-icon">🎮</span>
        games
      </button>

      <button
        class="room-btn"
        id="room-random"
        onclick="switchRoom('random')"
      >
        <span class="room-icon">🎲</span>
        random
      </button>

      <button
        class="room-btn"
        id="room-homework"
        onclick="switchRoom('homework')"
      >
        <span class="room-icon">📚</span>
        homework
      </button>

    </div>

    <!-- ONLINE -->

    <div class="online-section">

      <div class="online-label">
        online
      </div>

      <div id="onlineList"></div>

    </div>

  </div>

  <!-- MAIN CHAT -->

  <div class="chat-main">

    <div class="chat-header">

      <div>

        <div
          class="chat-title"
          id="chatRoomTitle"
        >
          # general
        </div>

        <div
          class="chat-subtitle"
          id="chatRoomSub"
        >
          everyone on luna
        </div>

      </div>

    </div>

    <div
      class="messages"
      id="messages"
    >
      <div class="system-msg">
        welcome to luna chat 🌙
      </div>
    </div>

    <div class="chat-input-wrap">

      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="say something... paste image URL or /gif cats"
        maxlength="300"
        onkeydown="if(event.key==='Enter')sendMessage()"
      >

      <button
        class="send-btn"
        onclick="sendMessage()"
      >
        send
      </button>

    </div>

  </div>

  <!-- DM PANEL -->

  <div
    class="dm-panel"
    id="dmPanel"
    style="display:none;"
  >

    <div class="dm-header">

      <div>

        <div class="dm-title">
          direct message
        </div>

        <div
          id="dmTarget"
          style="font-size:12px;color:var(--accent3);margin-top:2px;"
        ></div>

      </div>

      <button
        class="dm-close"
        onclick="closeDM()"
      >
        ×
      </button>

    </div>

    <div
      class="dm-messages"
      id="dmMessages"
    ></div>

    <div class="dm-input-wrap">

      <input
        type="text"
        class="dm-input"
        id="dmInput"
        placeholder="message..."
        maxlength="300"
        onkeydown="if(event.key==='Enter')sendDM()"
      >

      <button
        class="dm-send"
        onclick="sendDM()"
      >
        →
      </button>

    </div>

  </div>

</div>

<script>

/* =========================================
   SETTINGS
========================================= */

const WORKER =
  'https://cosmoshub.alrmax1290.workers.dev';

/*
   CHANGE THIS.

   IMPORTANT:
   This is NOT secure if you put the real
   admin password directly into frontend code.

   Your Worker should also verify admin
   permissions.
*/

const ADMIN_KEY = 'admin3d3d3d';


/* =========================================
   VARIABLES
========================================= */

let username =
  localStorage.getItem('luna_username') || '';

let currentRoom = 'general';

let lastMessageTime = 0;

let dmUser = null;

let lastDMTime = 0;

let pollInterval = null;

let dmInterval = null;

let onlineInterval = null;

let isAdmin =
  localStorage.getItem('luna_admin') === 'true';


/* =========================================
   ROOMS
========================================= */

const roomInfo = {

  general: {
    title: '# general',
    sub: 'everyone on luna'
  },

  games: {
    title: '# games',
    sub: 'talk about games'
  },

  random: {
    title: '# random',
    sub: 'anything goes'
  },

  homework: {
    title: '# homework',
    sub: 'help each other out'
  }

};


/* =========================================
   BLOCKED WORD FILTER
========================================= */

/*
   Add words here that you want blocked.

   The list below intentionally uses generic
   placeholders rather than reproducing slurs.
*/

const blockedWords = [

  'badword1',
  'badword2',
  'badword3',
  'curseword1',
  'curseword2'

];


/*
   Checks text for blocked words.

   It also catches things such as:

   badword
   BADWORD
   b.a.d.w.o.r.d

*/

function containsBlockedWord(text) {

  const normalized = text
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, '');

  for (const word of blockedWords) {

    if (
      normalized.includes(
        word.toLowerCase()
      )
    ) {
      return true;
    }

  }

  return false;
}


/* =========================================
   FILTER WARNING
========================================= */

function showFilterWarning() {

  const warning =
    document.getElementById('filterWarning');

  warning.style.display = 'block';

  clearTimeout(
    window.filterWarningTimeout
  );

  window.filterWarningTimeout =
    setTimeout(() => {

      warning.style.display = 'none';

    }, 3000);

}


/* =========================================
   INIT
========================================= */

if (username) {

  document.getElementById(
    'usernameOverlay'
  ).style.display = 'none';

  document.getElementById(
    'currentUser'
  ).textContent = username;

  updateAdminUI();

  startChat();

}


/* =========================================
   USERNAME
========================================= */

function setUsername() {

  const val =
    document
      .getElementById('usernameSetInput')
      .value
      .trim();

  if (!val || val.length < 2) {

    alert(
      'pick a name with at least 2 characters'
    );

    return;

  }

  username = val;

  localStorage.setItem(
    'luna_username',
    username
  );

  document.getElementById(
    'usernameOverlay'
  ).style.display = 'none';

  document.getElementById(
    'currentUser'
  ).textContent = username;

  startChat();

}


/* =========================================
   CHANGE USERNAME
========================================= */

function changeUsernameHandler() {

  const val =
    document
      .getElementById('changeUsername')
      .value
      .trim();

  if (!val || val.length < 2) {

    return;

  }

  username = val;

  localStorage.setItem(
    'luna_username',
    username
  );

  document.getElementById(
    'currentUser'
  ).textContent = username;

  document.getElementById(
    'changeUsername'
  ).value = '';

}


/* =========================================
   ADMIN LOGIN
========================================= */

function loginAdmin() {

  const key =
    prompt('Enter admin key:');

  if (!key) return;

  if (key === ADMIN_KEY) {

    isAdmin = true;

    localStorage.setItem(
      'luna_admin',
      'true'
    );

    updateAdminUI();

    alert('Admin mode enabled.');

  } else {

    alert('Wrong admin key.');

  }

}


/*
   Double-click your username in the sidebar
   to open the admin login.
*/

document
  .getElementById('currentUser')
  .addEventListener(
    'dblclick',
    loginAdmin
  );


/* =========================================
   ADMIN UI
========================================= */

function updateAdminUI() {

  const box =
    document.getElementById('adminBox');

  if (isAdmin) {

    box.classList.add('show');

  } else {

    box.classList.remove('show');

  }

}


/* =========================================
   LOGOUT ADMIN
========================================= */

function logoutAdmin() {

  isAdmin = false;

  localStorage.removeItem(
    'luna_admin'
  );

  updateAdminUI();

}


/* =========================================
   CHAT START
========================================= */

function startChat() {

  loadMessages();

  if (pollInterval) {
    clearInterval(pollInterval);
  }

  if (onlineInterval) {
    clearInterval(onlineInterval);
  }

  pollInterval =
    setInterval(
      pollMessages,
      3000
    );

  onlineInterval =
    setInterval(
      pingOnline,
      8000
    );

  pingOnline();

}


/* =========================================
   SWITCH ROOM
========================================= */

function switchRoom(room) {

  currentRoom = room;

  lastMessageTime = 0;

  document
    .querySelectorAll('.room-btn')
    .forEach(button => {

      button.classList.remove(
        'active'
      );

    });

  document
    .getElementById(
      'room-' + room
    )
    .classList.add('active');

  document
    .getElementById(
      'chatRoomTitle'
    )
    .textContent =
      roomInfo[room].title;

  document
    .getElementById(
      'chatRoomSub'
    )
    .textContent =
      roomInfo[room].sub;

  document
    .getElementById(
      'messages'
    )
    .innerHTML =
      '<div class="system-msg">switched to #' +
      room +
      '</div>';

  loadMessages();

}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages() {

  try {

    const res =
      await fetch(
        `${WORKER}/chat?room=${currentRoom}&since=${lastMessageTime}`
      );

    const data =
      await res.json();

    if (
      data.messages &&
      data.messages.length
    ) {

      appendMessages(
        data.messages
      );

      lastMessageTime =
        data.messages[
          data.messages.length - 1
        ].time;

    }

  } catch (e) {

    console.log(
      'Could not load messages'
    );

  }

}


/* =========================================
   POLL
========================================= */

async function pollMessages() {

  try {

    const res =
      await fetch(
        `${WORKER}/chat?room=${currentRoom}&since=${lastMessageTime}`
      );

    const data =
      await res.json();

    if (
      data.messages &&
      data.messages.length
    ) {

      appendMessages(
        data.messages
      );

      lastMessageTime =
        data.messages[
          data.messages.length - 1
        ].time;

    }

  } catch (e) {}

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(text) {

  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================================
   MESSAGE CONTENT
========================================= */

function renderMessageContent(text) {

  const imgRegex =
    /https?:\/\/\S+\.(png|jpg|jpeg|gif|webp)(\?\S*)?/gi;


  /* GIF */

  if (text.startsWith('/gif ')) {

    const query =
      encodeURIComponent(
        text.slice(5).trim()
      );

    const id =
      'gif_' +
      Math.random()
        .toString(36)
        .slice(2);

    setTimeout(
      async () => {

        try {

          const res =
            await fetch(
              `https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=${query}&limit=1&rating=g`
            );

          const data =
            await res.json();

          const el =
            document.getElementById(id);

          if (
            el &&
            data.data &&
            data.data[0]
          ) {

            const url =
              data.data[0]
                .images
                .fixed_height
                .url;

            el.innerHTML =
              `<img src="${url}" style="max-width:240px;border-radius:8px;display:block;margin-top:6px;">`;

          } else if (el) {

            el.textContent =
              'no gif found';

          }

        } catch (e) {}

      },
      0
    );

    return `
      <span style="font-size:11px;color:var(--muted);">
        /gif ${escapeHTML(text.slice(5))}
      </span>

      <div id="${id}" style="margin-top:4px;">
        <span style="font-size:11px;color:var(--dim);">
          loading gif...
        </span>
      </div>
    `;

  }


  /* IMAGE */

  if (imgRegex.test(text)) {

    imgRegex.lastIndex = 0;

    const safe =
      escapeHTML(text);

    return safe.replace(
      /https?:\/\/\S+\.(png|jpg|jpeg|gif|webp)(\?\S*)?/gi,
      url => {

        return `
          <a
            href="${url}"
            target="_blank"
            style="color:var(--accent3);"
          >
            ${url}
          </a>

          <br>

          <img
            src="${url}"
            style="max-width:240px;max-height:200px;border-radius:8px;display:block;margin-top:6px;"
            onclick="window.open('${url}','_blank')"
            onerror="this.style.display='none'"
          >
        `;

      }
    );

  }


  /* NORMAL LINKS */

  const safe =
    escapeHTML(text);

  return safe.replace(
    /https?:\/\/[^\s]+/g,
    url => {

      return `
        <a
          href="${url}"
          target="_blank"
          style="color:var(--accent3);text-decoration:underline;"
        >
          ${url}
        </a>
      `;

    }
  );

}


/* =========================================
   APPEND MESSAGES
========================================= */

function appendMessages(msgs) {

  const container =
    document.getElementById(
      'messages'
    );

  const wasAtBottom =
    container.scrollHeight -
    container.clientHeight <=
    container.scrollTop + 50;


  msgs.forEach(msg => {

    const div =
      document.createElement('div');

    div.className =
      'msg' +
      (
        msg.user === username
          ? ' own'
          : ''
      );


    const initial =
      (msg.user || '?')[0]
        .toUpperCase();


    const time =
      new Date(
        msg.time
      ).toLocaleTimeString(
        [],
        {
          hour: '2-digit',
          minute: '2-digit'
        }
      );


    const isOwn =
      msg.user === username;


    const canDelete =
      isOwn || isAdmin;


    div.innerHTML = `

      <div class="msg-avatar">
        ${escapeHTML(initial)}
      </div>

      <div class="msg-content">

        <div class="msg-header">

          <span
            class="msg-user"
            onclick="openDM('${escapeHTML(msg.user)}')"
            style="cursor:pointer;"
          >
            ${escapeHTML(msg.user)}
          </span>

          <span class="msg-time">
            ${time}
          </span>

          ${
            canDelete
              ? `
                <button
                  class="del-btn"
                  onclick="deleteMsg('${escapeHTML(msg.id)}')"
                >
                  ${isAdmin && !isOwn ? 'ADMIN DELETE' : 'DELETE'}
                </button>
              `
              : ''
          }

        </div>

        <div class="msg-text">
          ${renderMessageContent(msg.text)}
        </div>

      </div>
    `;


    container.appendChild(div);

  });


  if (wasAtBottom) {

    container.scrollTop =
      container.scrollHeight;

  }

}


/* =========================================
   DELETE MESSAGE
========================================= */

async function deleteMsg(id) {

  if (!isAdmin) {

    const confirmed =
      confirm(
        'Delete your message?'
      );

    if (!confirmed) return;

  } else {

    const confirmed =
      confirm(
        'Admin: delete this message?'
      );

    if (!confirmed) return;

  }


  try {

    const res =
      await fetch(
        `${WORKER}/chat/delete`,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({

            room: currentRoom,

            id: id,

            user: username,

            admin: isAdmin,

            adminKey:
              isAdmin
                ? ADMIN_KEY
                : null

          })

        }
      );


    if (res.ok) {

      loadMessages();

    } else {

      alert(
        'You do not have permission to delete this message.'
      );

    }

  } catch (e) {

    alert(
      'Could not delete message.'
    );

  }

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

  const input =
    document.getElementById(
      'chatInput'
    );

  const text =
    input.value.trim();


  if (!text || !username) {

    return;

  }


  /* BLOCK BAD WORDS */

  if (containsBlockedWord(text)) {

    input.value = '';

    showFilterWarning();

    return;

  }


  input.value = '';


  try {

    await fetch(
      `${WORKER}/chat`,
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body: JSON.stringify({

          room: currentRoom,

          user: username,

          text: text,

          admin: isAdmin

        })

      }
    );


    await pollMessages();


  } catch (e) {

    alert(
      'Could not send message.'
    );

  }

}


/* =========================================
   DM
========================================= */

function openDM(user) {

  if (user === username) {
    return;
  }

  dmUser = user;

  document.getElementById(
    'dmPanel'
  ).style.display = 'flex';

  document.getElementById(
    'dmTarget'
  ).textContent = user;

  document.getElementById(
    'dmMessages'
  ).innerHTML = '';

  lastDMTime = 0;

  loadDMs();


  if (dmInterval) {

    clearInterval(
      dmInterval
    );

  }


  dmInterval =
    setInterval(
      loadDMs,
      4000
    );

}


function closeDM() {

  dmUser = null;

  document.getElementById(
    'dmPanel'
  ).style.display = 'none';


  if (dmInterval) {

    clearInterval(
      dmInterval
    );

  }

}


/* =========================================
   LOAD DMS
========================================= */

async function loadDMs() {

  if (!dmUser) return;

  try {

    const res =
      await fetch(
        `${WORKER}/dm?user=${encodeURIComponent(username)}&other=${encodeURIComponent(dmUser)}`
      );

    const data =
      await res.json();


    if (
      data.messages &&
      data.messages.length
    ) {

      const container =
        document.getElementById(
          'dmMessages'
        );


      const newMsgs =
        lastDMTime
          ? data.messages.filter(
              m =>
                m.time >
                lastDMTime
            )
          : data.messages;


      newMsgs.forEach(msg => {

        const div =
          document.createElement(
            'div'
          );

        div.className =
          'msg' +
          (
            msg.from === username
              ? ' own'
              : ''
          );


        const time =
          new Date(
            msg.time
          ).toLocaleTimeString(
            [],
            {
              hour: '2-digit',
              minute: '2-digit'
            }
          );


        div.innerHTML = `

          <div class="msg-avatar">
            ${escapeHTML(
              msg.from[0].toUpperCase()
            )}
          </div>

          <div class="msg-content">

            <div class="msg-header">

              <span class="msg-user">
                ${escapeHTML(msg.from)}
              </span>

              <span class="msg-time">
                ${time}
              </span>

            </div>

            <div class="msg-text">
              ${renderMessageContent(msg.text)}
            </div>

          </div>
        `;


        container.appendChild(div);

      });


      if (newMsgs.length) {

        lastDMTime =
          data.messages[
            data.messages.length - 1
          ].time;

        container.scrollTop =
          container.scrollHeight;

      }

    }

  } catch (e) {}

}


/* =========================================
   SEND DM
========================================= */

async function sendDM() {

  const input =
    document.getElementById(
      'dmInput'
    );

  const text =
    input.value.trim();


  if (
    !text ||
    !dmUser ||
    !username
  ) {

    return;

  }


  /* FILTER DMS TOO */

  if (containsBlockedWord(text)) {

    input.value = '';

    showFilterWarning();

    return;

  }


  input.value = '';


  try {

    await fetch(
      `${WORKER}/dm`,
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body: JSON.stringify({

          from: username,

          to: dmUser,

          text: text

        })

      }
    );


    await loadDMs();

  } catch (e) {}

}


/* =========================================
   ONLINE USERS
========================================= */

async function pingOnline() {

  if (!username) return;

  try {

    const res =
      await fetch(
        `${WORKER}/online`,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            user: username
          })

        }
      );


    const data =
      await res.json();


    const list =
      document.getElementById(
        'onlineList'
      );


    list.innerHTML =
      (data.online || [])
        .map(u => `

          <div
            class="online-user"
            onclick="openDM('${escapeHTML(u)}')"
          >

            <div class="online-dot"></div>

            <span>
              ${escapeHTML(u)}
              ${
                u === username
                  ? ' (you)'
                  : ''
              }
            </span>

          </div>

        `)
        .join('');


  } catch (e) {}

}


/* =========================================
   F1
========================================= */

document.addEventListener(
  'keydown',
  e => {

    if (e.key === 'F1') {

      e.preventDefault();

      window.location.href =
        'https://google.com';

    }

  }
);


/* =========================================
   PAGE TRANSITIONS
========================================= */

document
  .querySelectorAll('a[href]')
  .forEach(link => {

    const href =
      link.getAttribute('href');


    if (
      !href ||
      href.startsWith('#') ||
      href.startsWith('http')
    ) {

      return;

    }


    link.addEventListener(
      'click',
      e => {

        e.preventDefault();


        if (pollInterval) {

          clearInterval(
            pollInterval
          );

        }


        if (dmInterval) {

          clearInterval(
            dmInterval
          );

        }


        if (onlineInterval) {

          clearInterval(
            onlineInterval
          );

        }


        setTimeout(
          () => {

            window.location.href =
              href;

          },
          200
        );

      }
    );

  });

</script>
