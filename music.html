<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music - Luna</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #070510; --surface2: rgba(255,255,255,0.07); --border: rgba(255,255,255,0.08); --accent2: #7b5fff; --accent: #ff3d7f; --text: #f0eeff; --muted: #8a85a8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
a { text-decoration: none; color: inherit; }
nav { display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 64px; background: rgba(7,5,16,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10; }
.nav-logo { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #fff, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.nav-links { display: flex; gap: 4px; }
.nav-links a { padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); transition: all 0.2s; }
.nav-links a:hover { color: #fff; background: var(--surface2); }
.nav-links a.active { color: #00e5ff; }
.topbar { display: flex; align-items: center; padding: 10px 24px; background: rgba(7,5,16,0.85); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 10px; }
.music-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }
.topbar-title { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 1px; }
.topbar-tip { font-size: 12px; color: var(--muted); }
.frame-wrap { flex: 1; position: relative; overflow: hidden; }
.frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; background: #000; }
.loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 5; gap: 16px; transition: opacity 0.3s; }
.loader.hidden { opacity: 0; pointer-events: none; }
.loader-text { font-size: 14px; color: var(--muted); font-weight: 600; }
@media (max-width: 700px) { nav { padding: 0 16px; height: 52px; } .nav-links a { padding: 5px 8px; font-size: 12px; } .topbar-tip { display: none; } }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">LU<span style="-webkit-text-fill-color:#00e5ff">NA</span></a>
  <div class="nav-links">
    <a href="index.html">home</a>
    <a href="singlefile.html">games</a>
    <a href="movies.html">movies</a>
    <a href="music.html" class="active">music</a>
    <a href="settings.html">settings</a>
  </div>
</nav>
<div class="topbar">
  <div class="music-dot"></div>
  <div class="topbar-title">🎵 Music</div>
  <div class="topbar-tip">Vibe out to your favorites</div>
</div>
<div class="frame-wrap">
  <div class="loader" id="loader">
    <div class="loader-text">Loading Music...</div>
  </div>
  <iframe id="frame" src="https://unpkg.com/opiumbest/index.svg" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>
<script>
const frame = document.getElementById("frame");
const loader = document.getElementById("loader");
frame.onload = () => loader.classList.add("hidden");
setTimeout(() => loader.classList.add("hidden"), 5000);
document.addEventListener('keydown', e => { if (e.key === 'F1') { e.preventDefault(); window.location.href = 'https://google.com'; } });
</script>
</body>
</html>
