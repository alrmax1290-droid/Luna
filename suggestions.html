<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestions - Luna</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #04040a; --bg2: #080812;
  --surface2: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.06);
  --accent2: #7090ff; --accent3: #a0b8ff;
  --moon: #e8eeff; --text: #d0d8f0; --muted: #606880; --dim: #303848;
}
body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { text-decoration: none; color: inherit; }
nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 36px; height: 60px;
  background: rgba(4,4,10,0.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.nav-logo { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--moon); letter-spacing: 4px; }
.nav-logo span { color: var(--accent2); }
.nav-links { display: flex; gap: 2px; }
.nav-links a { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.2s; }
.nav-links a:hover { color: var(--text); background: var(--surface2); }
.nav-links a.active { color: var(--accent3); }

.page { max-width: 680px; margin: 0 auto; padding: 48px 36px; }
.page-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
.page-label::before { content: '// '; color: var(--dim); }
.page-title { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; color: var(--moon); margin-bottom: 8px; }
.page-sub { font-size: 14px; color: var(--muted); margin-bottom: 40px; line-height: 1.6; }

.submit-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 24px; margin-bottom: 40px;
}
.input-label { font-size: 12px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 1px; margin-bottom: 8px; display: block; }
.text-input {
  width: 100%; padding: 12px 16px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px;
  font-family: 'Space Grotesk', sans-serif; outline: none; transition: all 0.2s;
  margin-bottom: 16px;
}
.text-input:focus { border-color: rgba(112,144,255,0.4); background: rgba(255,255,255,0.05); }
.text-input::placeholder { color: var(--muted); }
textarea.text-input { resize: vertical; min-height: 100px; line-height: 1.6; }

.type-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.type-chip {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.15s;
}
.type-chip:hover { border-color: rgba(112,144,255,0.3); color: var(--text); }
.type-chip.selected { background: rgba(112,144,255,0.15); border-color: var(--accent2); color: var(--accent3); }

.submit-btn {
  width: 100%; padding: 13px; border-radius: 8px; background: var(--accent2);
  border: none; color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(112,144,255,0.25);
}
.submit-btn:hover { background: #5070ee; transform: translateY(-1px); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #1a3a1a; border: 1px solid #4a9a5a; color: #80c890;
  padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
  z-index: 9999; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  font-family: 'Space Mono', monospace; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: #3a1a1a; border-color: #9a4a4a; color: #c88080; }

.suggestions-list { display: flex; flex-direction: column; gap: 12px; }
.section-label {
  font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted);
  letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::before { content: '//'; color: var(--dim); }

.suggestion-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px; transition: all 0.2s;
}
.suggestion-card:hover { border-color: rgba(112,144,255,0.2); }
.suggestion-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.suggestion-type {
  padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700;
  font-family: 'Space Mono', monospace; letter-spacing: 1px; text-transform: uppercase;
}
.type-game { background: rgba(112,144,255,0.15); color: var(--accent3); }
.type-feature { background: rgba(80,200,120,0.15); color: #80c890; }
.type-bug { background: rgba(255,100,100,0.15); color: #ff8080; }
.type-other { background: rgba(255,200,80,0.15); color: #ffd060; }
.suggestion-name { font-size: 11px; color: var(--dim); font-family: 'Space Mono', monospace; }
.suggestion-text { font-size: 14px; color: var(--text); line-height: 1.6; }
.suggestion-meta { font-size: 11px; color: var(--dim); margin-top: 8px; font-family: 'Space Mono', monospace; }

.vote-btn {
  display: flex; align-items: center; gap: 6px; margin-top: 10px;
  padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
  font-family: 'Space Grotesk', sans-serif; transition: all 0.15s;
}
.vote-btn:hover { border-color: rgba(112,144,255,0.3); color: var(--accent3); background: rgba(112,144,255,0.08); }
.vote-btn.voted { border-color: var(--accent2); color: var(--accent3); background: rgba(112,144,255,0.1); }

.loading-text { text-align: center; padding: 40px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2px; }
.empty-text { text-align: center; padding: 40px; color: var(--dim); font-size: 14px; }

@media (max-width: 600px) {
  nav { padding: 0 16px; }
  .nav-links a { padding: 5px 8px; font-size: 12px; }
  .page { padding: 32px 16px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">LU<span>NA</span></a>
  <div class="nav-links">
    <a href="index.html">home</a>
    <a href="singlefile.html">games</a>
    <a href="browse.html">browse</a>
    <a href="suggestions.html" class="active">suggestions</a>
    <a href="settings.html">settings</a>
  </div>
</nav>

<div class="page">
  <div class="page-label">feedback</div>
  <div class="page-title">suggestions</div>
  <div class="page-sub">got an idea? found a bug? want a game added? drop it here and i'll see it</div>

  <div class="submit-box">
    <label class="input-label">your name (optional)</label>
    <input type="text" class="text-input" id="nameInput" placeholder="anonymous">

    <label class="input-label">type</label>
    <div class="type-row">
      <button class="type-chip selected" onclick="selectType('game')">🎮 game request</button>
      <button class="type-chip" onclick="selectType('feature')">✨ feature idea</button>
      <button class="type-chip" onclick="selectType('bug')">🐛 bug report</button>
      <button class="type-chip" onclick="selectType('other')">💬 other</button>
    </div>

    <label class="input-label">suggestion</label>
    <textarea class="text-input" id="suggestionInput" placeholder="what's on your mind..."></textarea>

    <button class="submit-btn" id="submitBtn" onclick="submitSuggestion()">send it →</button>
  </div>

  <div class="section-label">what people want</div>
  <div id="suggestionsList" class="suggestions-list">
    <div class="loading-text">loading...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://cosmos-hub.alrmax1290.workers.dev';
let selectedType = 'game';
let voted = JSON.parse(localStorage.getItem('luna_votes') || '[]');

function selectType(type) {
  selectedType = type;
  document.querySelectorAll('.type-chip').forEach(c => c.classList.remove('selected'));
  event.target.classList.add('selected');
}

function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (error ? ' error' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function submitSuggestion() {
  const text = document.getElementById('suggestionInput').value.trim();
  if (!text) { showToast('write something first', true); return; }

  const name = document.getElementById('nameInput').value.trim() || 'anonymous';
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'sending...';

  try {
    const res = await fetch(`${WORKER}/suggestions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name, type: selectedType, text,
        time: Date.now()
      })
    });
    if (res.ok) {
      showToast('✓ suggestion sent!');
      document.getElementById('suggestionInput').value = '';
      document.getElementById('nameInput').value = '';
      loadSuggestions();
    } else {
      showToast('something went wrong', true);
    }
  } catch(e) {
    showToast('could not connect', true);
  }
  btn.disabled = false;
  btn.textContent = 'send it →';
}

async function voteSuggestion(id) {
  if (voted.includes(id)) return;
  voted.push(id);
  localStorage.setItem('luna_votes', JSON.stringify(voted));
  document.getElementById(`vote-${id}`).classList.add('voted');
  document.getElementById(`vote-count-${id}`).textContent = parseInt(document.getElementById(`vote-count-${id}`).textContent) + 1;
  await fetch(`${WORKER}/suggestions/vote`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  }).catch(() => {});
}

async function loadSuggestions() {
  const list = document.getElementById('suggestionsList');
  try {
    const res = await fetch(`${WORKER}/suggestions`);
    const data = await res.json();
    if (!data.suggestions || !data.suggestions.length) {
      list.innerHTML = '<div class="empty-text">no suggestions yet — be the first!</div>';
      return;
    }
    const sorted = data.suggestions.sort((a,b) => (b.votes||0) - (a.votes||0));
    list.innerHTML = sorted.map(s => `
      <div class="suggestion-card">
        <div class="suggestion-header">
          <span class="suggestion-type type-${s.type}">${{game:'🎮 game',feature:'✨ feature',bug:'🐛 bug',other:'💬 other'}[s.type]||s.type}</span>
          <span class="suggestion-name">by ${s.name}</span>
        </div>
        <div class="suggestion-text">${s.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div class="suggestion-meta">${new Date(s.time).toLocaleDateString()}</div>
          <button class="vote-btn ${voted.includes(s.id)?'voted':''}" id="vote-${s.id}" onclick="voteSuggestion('${s.id}')">
            ↑ <span id="vote-count-${s.id}">${s.votes||0}</span>
          </button>
        </div>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = '<div class="empty-text">could not load suggestions</div>';
  }
}

// Page transitions
document.querySelectorAll('a[href]').forEach(link => {
  const href = link.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('http')) return;
  link.addEventListener('click', e => {
    e.preventDefault();
    setTimeout(() => { window.location.href = href; }, 200);
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'F1') { e.preventDefault(); window.location.href = 'https://google.com'; }
});

loadSuggestions();
</script>
</body>
</html>
